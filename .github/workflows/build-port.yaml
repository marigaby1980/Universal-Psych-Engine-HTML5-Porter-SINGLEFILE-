name: Universal Psych Engine HTML5 Porter (Single-File)

on:
  workflow_dispatch:
    inputs:
      mod_url:
        description: 'Direct download URL to the mod .zip (Google Drive, Dropbox, MediaFire, GitHub, Discord CDN, etc.)'
        required: true
        type: string
      psych_repo:
        description: 'Psych Engine source repo (owner/name) — leave default unless using a fork'
        required: false
        type: string
        default: 'ShadowMario/FNF-PsychEngine'
      psych_ref:
        description: 'Branch/tag/commit of the engine to build'
        required: false
        type: string
        default: 'main'
      output_filename:
        description: 'Name of the final standalone HTML file (placed at repo root)'
        required: false
        type: string
        default: 'index.html'
      lime_version:
        description: 'Exact lime version to pin (maintainer-confirmed working version for stock Psych Engine 1.0+)'
        required: false
        type: string
        default: '8.1.2'
      openfl_version:
        description: 'Exact openfl version to pin (maintainer-confirmed working version for stock Psych Engine 1.0+)'
        required: false
        type: string
        default: '9.3.3'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ------------------------------------------------------------------
      # 1. Get the engine + the mod
      # ------------------------------------------------------------------
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: 'repo'

      - name: Checkout Psych Engine source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.psych_repo }}
          ref: ${{ inputs.psych_ref }}
          path: 'engine-source'

      - name: Download mod payload
        run: |
          set -e
          echo "Downloading mod from provided URL..."
          pip install --quiet "gdown>=5.2,<7"

          URL="${{ inputs.mod_url }}"
          mkdir -p mods_upload

          if [[ "$URL" == *"drive.google.com"* ]]; then
            gdown "$URL" -O mod-payload.zip
          elif [[ "$URL" == *"dropbox.com"* ]]; then
            wget -q -O mod-payload.zip "${URL%%\?*}?dl=1"
          else
            wget -q --content-disposition -O mod-payload.zip "$URL"
          fi

          if [ ! -s mod-payload.zip ]; then
            echo "::error::Download failed or produced an empty file. Check that the URL is a direct download link and is publicly accessible."
            exit 1
          fi

          FTYPE=$(file -b mod-payload.zip)
          echo "Downloaded file type: $FTYPE"
          if [[ "$FTYPE" != *"Zip archive"* ]]; then
            echo "::error::Downloaded file is not a zip archive. Got: $FTYPE. The URL likely points to an HTML page (e.g. a Drive 'confirm download' page) instead of the raw file."
            exit 1
          fi

          echo "Extracting mod payload..."
          unzip -q mod-payload.zip -d mods_upload/
          rm mod-payload.zip

          # Some mod zips wrap everything in one extra top-level folder
          # (e.g. "MyMod v1/songs/..."). Flatten that one level if present.
          ENTRIES=$(find mods_upload -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$ENTRIES" -eq 1 ] && [ -d "$(find mods_upload -mindepth 1 -maxdepth 1)" ]; then
            INNER=$(find mods_upload -mindepth 1 -maxdepth 1)
            echo "Flattening single wrapper folder: $INNER"
            mv "$INNER"/* mods_upload/ 2>/dev/null || true
            mv "$INNER"/.[!.]* mods_upload/ 2>/dev/null || true
            rmdir "$INNER" || true
          fi

          echo "Mod contents (top level):"
          ls -la mods_upload/

      # ------------------------------------------------------------------
      # 2. Inject mod into engine (any Psych mod layout: assets/ and/or mods/)
      # ------------------------------------------------------------------
      - name: Inject mod into engine
        run: |
          set -e
          cd engine-source

          # CRITICAL: Psych Engine's mods/ convention only works when
          # MODS_ALLOWED is compiled in, and Project.xml declares
          # `<define name="MODS_ALLOWED" if="desktop" />` — desktop only.
          # Every mods/-reading code path (backend/Mods.hx,
          # backend/Paths.hx's getPath()/modFolders()) is dead code on
          # HTML5, compiled out entirely. A mod placed in mods/ was
          # completely inert on web: never read, never merged into the
          # build, never shown — confirmed directly from the real
          # Paths.hx source, whose getPath() falls straight through to
          # getSharedPath() -> 'assets/shared/$file' on web, with no
          # mods/ check at all.
          #
          # Instead, inject_mod_for_html5.py copies the mod's content
          # directly into the real assets/ subfolders the compiled web
          # build actually reads (mirroring Paths.hx's own resolution:
          # characters/images/stages -> assets/shared/images/, sounds ->
          # assets/shared/sounds/, songs/<name>/ -> assets/songs/<name>/,
          # etc.), and converts .ogg audio to .mp3 in the same pass —
          # Paths.hx declares `SOUND_EXT = #if web "mp3" #else "ogg"
          # #end`, and Project.xml explicitly excludes *.ogg on web, so a
          # mod shipping only .ogg (the normal FNF/Psych source format)
          # would have its audio silently excluded regardless of correct
          # folder placement.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg not found, installing..."
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          python3 "${GITHUB_WORKSPACE}/repo/.github/scripts/inject_mod_for_html5.py" \
            ../mods_upload .

          echo ""
          echo "Final assets/ file count: $(find assets -type f | wc -l)"

      # ------------------------------------------------------------------
      # 3. Toolchain
      # ------------------------------------------------------------------
      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.2

      - name: Install Haxelibs and dependencies
        run: |
          set -e
          cd engine-source
          echo "Working directory: $(pwd)"
          echo "Top-level contents:"
          ls -la

          haxelib setup ~/haxelib

          # Psych Engine's upstream repo does not ship an hmm.json (this is
          # a known, longstanding gap — the repo is archived/read-only, so
          # it never will). The authoritative source of truth for exact
          # library versions is Project.xml itself, via <haxelib name="..."
          # version="..."/> tags — this is also what `lime build` reads
          # directly, so installing from the same source guarantees they
          # match. If a fork DOES ship hmm.json, prefer it since it may
          # pin additional git/hg dependencies Project.xml doesn't express.
          if [ -f "hmm.json" ]; then
            echo "hmm.json found — installing pinned dependency versions via hmm."
            haxelib install hmm
            haxelib run hmm install
          fi

          if [ -f "Project.xml" ]; then
            echo "Installing exact library versions declared in Project.xml..."
            python3 "${GITHUB_WORKSPACE}/repo/.github/scripts/install_project_xml_libs.py" Project.xml
          else
            echo "::error::No Project.xml found in engine checkout — cannot determine required library versions."
            exit 1
          fi

          # lime/openfl are NOT declared as <haxelib> tags in Project.xml
          # (they're the build tool itself), so the step above never pins
          # them. Left alone, haxelib's own dependency resolver can pull in
          # whatever the LATEST lime/openfl is to satisfy some other
          # library's requirements (observed: installing hxvlc 2.0.1
          # transitively pulled lime 8.3.2 + openfl 9.5.2, silently
          # overriding the maintainer-confirmed working combo of
          # lime 8.1.2 / openfl 9.3.3 — which then broke HTML5 compilation
          # via a class, sys.thread.FixedThreadPool, that only exists on
          # native targets). Explicitly (re-)pin lime/openfl AFTER
          # everything else has installed, so no other library's transitive
          # resolution can override them afterward.
          echo "Pinning lime/openfl to known-good versions for this engine (override via workflow inputs if needed)..."
          haxelib install lime "${{ inputs.lime_version }}" --quiet
          haxelib install openfl "${{ inputs.openfl_version }}" --quiet
          haxelib set lime "${{ inputs.lime_version }}"
          haxelib set openfl "${{ inputs.openfl_version }}"

          # Verify every version-pinned lib actually resolves before moving
          # on, so a bad/incomplete install fails loudly here with a clear
          # message instead of confusingly mid-compile.
          echo "Verifying installed libraries resolve correctly..."
          python3 "${GITHUB_WORKSPACE}/repo/.github/scripts/verify_haxelibs.py" Project.xml

          echo "Final installed libraries:"
          haxelib list

          haxelib run lime setup html5

      # ------------------------------------------------------------------
      # 4. Strip/stub native (non-HTML5-safe) APIs so any engine version/fork
      #    compiles clean for the web target, regardless of what native
      #    features a given mod's custom scripts/Lua/HScript touch.
      # ------------------------------------------------------------------
      - name: Patch HTML5-incompatible code
        run: |
          set -e
          python3 "${GITHUB_WORKSPACE}/repo/.github/scripts/patch_engine.py" --engine-dir engine-source --haxelib-dir ~/haxelib

      # ------------------------------------------------------------------
      # 5. Compile
      # ------------------------------------------------------------------
      - name: Compile HTML5 build
        run: |
          set -e
          cd engine-source

          # Diagnostic: if the build fails on a native-only class again
          # (e.g. sys.thread.*), this prints every file across the engine
          # source AND all installed haxelibs that references it, so the
          # exact offending import is visible in this step's log instead
          # of requiring another blind guess-and-rerun cycle.
          echo "--- Pre-compile scan for sys.thread usage (diagnostic only) ---"
          grep -rn "sys\.thread\.\|sys\.thread;" source/ ~/haxelib 2>/dev/null \
            --include="*.hx" | grep -v "^source/Thread.hx\|^source/Mutex.hx" || echo "(no direct sys.thread references found)"
          echo "--- End diagnostic scan ---"

          haxelib run lime build html5 -release -D DISCORD_DISABLE -D NO_PRELOAD_ALL -D FLX_NO_DEBUG

      # ------------------------------------------------------------------
      # 6. Inline everything into ONE standalone .html file
      # ------------------------------------------------------------------
      - name: Bundle into single-file HTML
        id: bundle
        run: |
          set -e
          cd engine-source/export/release/html5/bin
          python3 "${GITHUB_WORKSPACE}/repo/.github/scripts/bundle_single_file.py" \
            --build-dir "." \
            --output "${GITHUB_WORKSPACE}/${{ inputs.output_filename }}" \
            --max-bytes 99000000 \
            --max-release-bytes 1950000000

      # ------------------------------------------------------------------
      # 7. Deliver the single HTML file: commit to repo root if it fits
      #    under GitHub's git-push limit, otherwise fall back to a
      #    GitHub Release asset (up to ~2GB) so large builds still reach
      #    the person instead of the job just failing.
      # ------------------------------------------------------------------
      - name: Commit standalone HTML to repo root
        if: steps.bundle.outputs.fits_in_repo == 'true'
        run: |
          set -e
          cd repo
          cp "${GITHUB_WORKSPACE}/${{ inputs.output_filename }}" "./${{ inputs.output_filename }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.output_filename }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated Psych Engine web port: ${{ inputs.output_filename }}"
            git push
          fi

      - name: Upload standalone HTML as a GitHub Release (large builds)
        if: steps.bundle.outputs.fits_in_repo == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd repo
          TAG="web-build-${{ github.run_number }}"
          echo "File is too large to commit directly (${{ steps.bundle.outputs.final_size_bytes }} bytes) — publishing as a GitHub Release asset instead."
          gh release create "$TAG" \
            "${GITHUB_WORKSPACE}/${{ inputs.output_filename }}" \
            --title "Web build ${{ github.run_number }}" \
            --notes "Automated Psych Engine web port. This build (${{ steps.bundle.outputs.final_size_bytes }} bytes) exceeds GitHub's 100MB repo file limit, so it's published here as a Release asset instead of committed to the repo root. Download the .html file below and open it directly in a browser." \
            --repo "${{ github.repository }}"
          echo "Release published. Download link will be shown in the job summary."
          echo "### Large build published as a Release" >> "$GITHUB_STEP_SUMMARY"
          echo "This build (${{ steps.bundle.outputs.final_size_bytes }} bytes) was too large to commit to the repo directly, so it was uploaded to a GitHub Release instead:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**[Download ${{ inputs.output_filename }}](https://github.com/${{ github.repository }}/releases/tag/$TAG)**" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact (backup / debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-html
          path: ${{ inputs.output_filename }}
          if-no-files-found: ignore
